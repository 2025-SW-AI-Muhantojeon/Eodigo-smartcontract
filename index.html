<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메타 트랜잭션 결제</title>
</head>
<body>
    <h1>메타 트랜잭션 결제</h1>
    
    <!-- 로그인 섹션 -->
    <div id="loginSection">
        <h2>로그인</h2>
        <div>
            <label>Username:</label>
            <input type="text" id="username" value="">
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="">
        </div>
        <button onclick="login()">로그인</button>
        <div id="loginStatus"></div>
    </div>

    <hr>

    <!-- 지갑 연결 섹션 -->
    <div id="walletSection" style="display: none;">
        <div id="walletStatus">지갑 연결 안됨</div>
        <button id="connectBtn" onclick="connectWallet()">MetaMask 연결</button>
    </div>
    
    <hr>
    
    <!-- 결제 섹션 -->
    <div id="paymentSection" style="display: none;">
        <h2>Store ID: 1</h2>
        
        <div>
            <label>결제 금액 (GIFT):</label>
            <input type="number" id="amount" value="1">
        </div>
        
        <div>
            <label>Gift Token 주소:</label>
            <input type="text" id="giftTokenAddress" value="0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9" style="width: 400px;">
        </div>
        
        <div>
            <label>Forwarder 주소:</label>
            <input type="text" id="forwarderAddress" value="0x5FbDB2315678afecb367f032d93F642f64180aa3" style="width: 400px;">
        </div>
        
        <div>
            <label>상점 지갑 주소:</label>
            <input type="text" id="storeWallet" value="0x70997970C51812dc3A010C7d01b50e0d17dc79C8" style="width: 400px;">
        </div>
        
        <button id="payBtn" onclick="makePayment()" disabled>결제하기</button>
    </div>
    
    <hr>
    
    <div id="status"></div>
    <pre id="log"></pre>

    <script>
        let accessToken = null;
        let userAddress;
        let chainId = 31337;

        // 로그인
        async function login() {
            try {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                if (!username || !password) {
                    alert('Username과 Password를 입력해주세요.');
                    return;
                }

                log('로그인 시도 중...');

                const response = await fetch('http://localhost:8081/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || '로그인 실패');
                }

                const result = await response.json();
                
                // API 응답 구조에 맞게 수정
                if (result.success && result.data && result.data.accessToken) {
                    accessToken = result.data.accessToken;
                    log(`✅ 로그인 성공!`);
                    log(`Access Token: ${accessToken.substring(0, 20)}...`);
                } else {
                    throw new Error('Access Token을 받지 못했습니다.');
                }

                document.getElementById('loginStatus').textContent = '✅ 로그인 성공!';
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('walletSection').style.display = 'block';

            } catch (error) {
                console.error(error);
                log('❌ 로그인 실패: ' + error.message);
                document.getElementById('loginStatus').textContent = '❌ 로그인 실패: ' + error.message;
            }
        }

        // 지갑 연결
        async function connectWallet() {
            try {
                if (typeof window.ethereum === 'undefined') {
                    alert('MetaMask를 설치해주세요.');
                    return;
                }

                // 현재 체인 ID 확인
                const currentChainId = await window.ethereum.request({ method: 'eth_chainId' });
                const currentChainIdDecimal = parseInt(currentChainId, 16);
                
                log(`현재 체인 ID: ${currentChainIdDecimal}`);

                // 하드햇 로컬 네트워크가 아니면 전환 요청
                if (currentChainIdDecimal !== chainId) {
                    log('하드햇 로컬 네트워크로 전환 중...');
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x7a69' }], // 31337의 hex 값
                        });
                    } catch (switchError) {
                        // 네트워크가 추가되지 않은 경우
                        if (switchError.code === 4902) {
                            log('하드햇 네트워크 추가 중...');
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [{
                                    chainId: '0x7a69',
                                    chainName: 'Hardhat Local',
                                    rpcUrls: ['http://127.0.0.1:8545'],
                                    nativeCurrency: {
                                        name: 'ETH',
                                        symbol: 'ETH',
                                        decimals: 18
                                    }
                                }]
                            });
                        } else {
                            throw switchError;
                        }
                    }
                }

                const accounts = await window.ethereum.request({ 
                    method: 'eth_requestAccounts' 
                });
                userAddress = accounts[0];

                document.getElementById('walletStatus').textContent = `연결됨: ${userAddress}`;
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('paymentSection').style.display = 'block';
                document.getElementById('payBtn').disabled = false;

                log(`지갑 연결: ${userAddress}`);
                log(`체인 ID: ${chainId}`);
            } catch (error) {
                alert('지갑 연결 실패: ' + error.message);
                log('❌ 지갑 연결 실패: ' + error.message);
            }
        }

        // 결제
        async function makePayment() {
            try {
                document.getElementById('payBtn').disabled = true;
                document.getElementById('status').textContent = '';
                
                log('=== 결제 시작 ===');

                const amount = document.getElementById('amount').value;
                const giftTokenAddress = document.getElementById('giftTokenAddress').value;
                const forwarderAddress = document.getElementById('forwarderAddress').value;
                const storeWallet = document.getElementById('storeWallet').value;

                // 2. Transfer 데이터 인코딩
                log('2. Transfer 데이터 인코딩...');
                const transferData = encodeTransferData(storeWallet, amount);
                log(`Transfer Data: ${transferData}`);

                // 3. EIP-712 도메인
                const domain = {
                    name: 'EodigoMinimalForwarder',
                    version: '1',
                    chainId: chainId,
                    verifyingContract: forwarderAddress
                };

                // 4. EIP-712 타입
                const types = {
                    ForwardRequest: [
                        { name: 'from', type: 'address' },
                        { name: 'to', type: 'address' },
                        { name: 'value', type: 'uint256' },
                        { name: 'gas', type: 'uint256' },
                        { name: 'nonce', type: 'uint256' },
                        { name: 'deadline', type: 'uint48' },
                        { name: 'data', type: 'bytes' }
                    ]
                };

                // 5. 메시지 생성
                const deadline = Math.floor(Date.now() / 1000) + 3600;
                const message = {
                    from: userAddress,
                    to: giftTokenAddress,
                    value: '0',
                    gas: '1000000',
                    nonce: 1,
                    deadline: deadline.toString(),
                    data: transferData
                };
                log('3. 메시지 생성 완료');

                // 6. EIP-712 서명 생성
                log('4. 서명 생성 중... (MetaMask 확인)');
                const signature = await window.ethereum.request({
                    method: 'eth_signTypedData_v4',
                    params: [userAddress, JSON.stringify({
                        types: {
                            EIP712Domain: [
                                { name: 'name', type: 'string' },
                                { name: 'version', type: 'string' },
                                { name: 'chainId', type: 'uint256' },
                                { name: 'verifyingContract', type: 'address' }
                            ],
                            ForwardRequest: types.ForwardRequest
                        },
                        primaryType: 'ForwardRequest',
                        domain: domain,
                        message: message
                    })]
                });
                log(`Signature: ${signature}`);

                // 7. 백엔드 전송 (JWT 토큰 포함)
                log('5. 백엔드 전송...');
                const paymentRequest = {
                    from: userAddress,
                    to: giftTokenAddress,
                    value: '0',
                    paymentValue: amount.toString(),
                    gas: '1000000',
                    nonce: 1,
                    deadline: deadline.toString(),
                    data: transferData,
                    signature: signature,
                    forwarderAddress: forwarderAddress,
                    chainId: chainId
                };

                const paymentResponse = await fetch('http://localhost:8081/api/store/1/payment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(paymentRequest)
                });

                if (!paymentResponse.ok) {
                    const errorData = await paymentResponse.json();
                    throw new Error(errorData.message || '결제 실패');
                }

                const result = await paymentResponse.json();
                log('=== 결제 완료 ===');
                log(JSON.stringify(result, null, 2));
                
                document.getElementById('status').textContent = '✅ 결제 성공!';
                
            } catch (error) {
                console.error(error);
                log('❌ 오류: ' + error.message);
                document.getElementById('status').textContent = '❌ 결제 실패: ' + error.message;
            } finally {
                document.getElementById('payBtn').disabled = false;
            }
        }

        // transfer(address to, uint256 amount) 함수 인코딩
        function encodeTransferData(toAddress, amount) {
            const functionSelector = '0xa9059cbb';
            const addressParam = toAddress.slice(2).toLowerCase().padStart(64, '0');
            const amountParam = BigInt(amount).toString(16).toLowerCase().padStart(64, '0');
            return functionSelector + addressParam + amountParam;
        }

        function log(message) {
            const logDiv = document.getElementById('log');
            logDiv.textContent += `[${new Date().toLocaleTimeString()}] ${message}\n`;
        }
    </script>
</body>
</html>
